version: '3.8'

services:
  atlas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas_backend_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ATLAS_API_HOST=0.0.0.0
      - ATLAS_API_PORT=8000
      - ATLAS_AUTH_ENABLED=false
      - ATLAS_DATABASE_URL=sqlite:///data/atlas.db
    volumes:
      - atlas_data:/app/data
      - atlas_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - atlas-net

  atlas-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas_streamlit_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
    command: ["python", "-m", "streamlit", "run", "atlas/frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    volumes:
      - atlas_data:/app/data
      - atlas_logs:/app/logs
    depends_on:
      atlas-api:
        condition: service_healthy
    networks:
      - atlas-net

volumes:
  atlas_data:
    driver: local
  atlas_logs:
    driver: local

networks:
  atlas-net:
    driver: bridge
